<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Films Fairy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0A0912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0A0912; --surface:#18152A; --surface-2:#221D3B;
    --text:#EFEBFA; --muted:#8A85A6; --border:rgba(239,235,250,.10);
    --accent:#00E0D6; --accent-ink:#06110F; --star:#FFD84D;
    --movie:#FF3D7F; --series:#FFB020; --anime:#8C5CFF;
    --cmovie:#2FE6B0; --cseries:#FF6B4A; --dorama:#4FA8FF;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --glow:0 0 16px rgba(0,224,214,.45);
    --edge:1px solid rgba(0,224,214,.22);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(ellipse at 50% -10%, rgba(140,92,255,.16), transparent 55%);
  }
  .serif{font-family:"Arial Narrow","Helvetica Neue Condensed",Oswald,sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    text-shadow:0 0 18px rgba(0,224,214,.35), 0 0 2px rgba(0,224,214,.6);
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 100px;min-height:100%;}
  header{padding:22px 4px 14px;}
  h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:.02em;}
  .stats{color:var(--muted);font-size:.88rem;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:6px;}
  .tab{
    flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 12px;
    font-size:.83rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--accent);text-shadow:0 0 10px rgba(0,224,214,.5);}
  .controls{position:sticky;top:0;background:none;padding:8px 0 10px;z-index:5;}
  input[type="search"]{
    width:100%;padding:10px 12px;border-radius:10px;border:var(--edge);
    background:transparent;color:var(--text);font-size:.95rem;
  }
  input[type="search"]::placeholder{color:var(--muted);}
  .search-row{display:flex;gap:8px;}
  .search-row input[type="search"]{flex:1;}
  .filter-btn{
    position:relative;flex-shrink:0;width:42px;border-radius:10px;border:var(--edge);
    background:transparent;color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .filter-btn svg{width:20px;height:20px;fill:currentColor;}
  .filter-btn .dot{
    position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--star);display:none;box-shadow:0 0 6px rgba(255,216,77,.7);
  }
  .filter-btn.on .dot{display:block;}
  .backup-row{display:flex;gap:10px;margin-top:10px;}
  .backup-row button{
    width:46px;height:38px;border-radius:10px;border:none;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .backup-row button svg{width:20px;height:20px;fill:currentColor;}
  .backup-row button:active{opacity:.8;}
  .month{color:var(--muted);font-size:.8rem;margin:18px 2px 8px;text-transform:none;}
  .card{
    position:relative;background:var(--surface);border-radius:10px;
    box-shadow:var(--shadow);padding:12px 14px 12px 16px;margin-bottom:10px;
    border-left:4px solid var(--movie);
  }
  .card.series{border-left-color:var(--series);}
  .card.anime{border-left-color:var(--anime);}
  .card.cartoon_movie{border-left-color:var(--cmovie);}
  .card.cartoon_series{border-left-color:var(--cseries);}
  .card.dorama{border-left-color:var(--dorama);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-size:1.05rem;font-weight:600;margin:0;}
  .card-title.best{
    background:linear-gradient(90deg,var(--star),var(--movie),var(--anime),var(--accent),var(--star));
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  @media (prefers-reduced-motion: no-preference){
    .card-title.best{animation:shimmer 5s linear infinite;}
  }
  @keyframes shimmer{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  .icon-btn.best-on{color:var(--star);text-shadow:0 0 8px rgba(255,216,77,.6);}
  .card-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{
    background:none;border:none;color:var(--muted);padding:6px;cursor:pointer;
    border-radius:8px;display:flex;align-items:center;
  }
  .icon-btn:active{background:var(--surface-2);}
  .meta-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .stars{color:var(--star);font-size:.9rem;letter-spacing:1px;}
  .badge{font-size:.7rem;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;}
  .date{font-size:.8rem;color:var(--muted);}
  .note{margin:8px 0 0;font-size:.88rem;color:var(--muted);line-height:1.4;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;}
  .empty .big{font-size:2.2rem;margin-bottom:8px;}
  .fab{
    position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    border:none;font-size:1.6rem;box-shadow:var(--glow),0 4px 14px rgba(0,0,0,.4);cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:10;
  }
  .filter-btn.on{box-shadow:var(--glow);border-color:var(--accent);}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:20;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;
    padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88vh;overflow-y:auto;
    border:1px solid rgba(0,224,214,.35);border-bottom:none;
    box-shadow:0 -6px 28px rgba(0,224,214,.18), 0 -10px 50px rgba(140,92,255,.12);
  }
  .sheet-handle-wrap{position:sticky;top:0;background:var(--surface);padding:10px 0 12px;display:flex;justify-content:center;touch-action:none;z-index:1;}
  .sheet-handle{width:40px;height:4px;border-radius:3px;background:rgba(239,235,250,.25);}
  .sheet h2{margin:0 0 14px;font-size:1.15rem;}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  #ratingGroup label{margin-top:14px;}
  input[type="text"],input[type="date"],textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:.95rem;font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  .type-toggle{display:flex;flex-wrap:wrap;gap:8px;}
  .type-toggle button{
    flex:1 1 28%;padding:10px 4px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:.85rem;cursor:pointer;
  }
  .type-toggle button.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .toggle-pill{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:.9rem;cursor:pointer;
  }
  .toggle-pill.active{background:var(--star);color:var(--accent-ink);border-color:var(--star);}
  .star-pick{display:flex;gap:6px;}
  .star-pick button{
    background:none;border:none;font-size:1.9rem;color:rgba(239,235,250,.28);cursor:pointer;padding:2px;
    line-height:1;
  }
  .star-pick button.on{color:var(--star);text-shadow:0 0 10px rgba(255,216,77,.55);}
  .sheet-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;padding:12px;border-radius:10px;border:none;font-size:.95rem;cursor:pointer;font-weight:600;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .field-hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="serif">Films Fairy</h1>
    <div class="stats" id="stats"></div>
    <div class="backup-row">
      <button id="exportBtn" type="button" aria-label="Сохранить резервную копию" title="Сохранить резервную копию">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8.00003 11C7.59557 11 7.23093 11.2436 7.07615 11.6173C6.92137 11.991 7.00692 12.4211 7.29292 12.7071L11.2929 16.7071C11.6834 17.0976 12.3166 17.0976 12.7071 16.7071L16.7071 12.7071C16.9931 12.4211 17.0787 11.991 16.9239 11.6173C16.7691 11.2436 16.4045 11 16 11H13.5V3C13.5 2.44771 13.0523 2 12.5 2H11.5C10.9477 2 10.5 2.44772 10.5 3V11H8.00003Z"/>
          <path d="M20 19C20.5523 19 21 19.4477 21 20V21C21 21.5523 20.5523 22 20 22H4C3.44772 22 3 21.5523 3 21V20C3 19.4477 3.44772 19 4 19H20Z"/>
        </svg>
      </button>
      <button id="importBtn" type="button" aria-label="Восстановить из файла" title="Восстановить из файла">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <g transform="translate(0,19) scale(1,-1)">
            <path d="M8.00003 11C7.59557 11 7.23093 11.2436 7.07615 11.6173C6.92137 11.991 7.00692 12.4211 7.29292 12.7071L11.2929 16.7071C11.6834 17.0976 12.3166 17.0976 12.7071 16.7071L16.7071 12.7071C16.9931 12.4211 17.0787 11.991 16.9239 11.6173C16.7691 11.2436 16.4045 11 16 11H13.5V3C13.5 2.44771 13.0523 2 12.5 2H11.5C10.9477 2 10.5 2.44772 10.5 3V11H8.00003Z"/>
          </g>
          <path d="M20 19C20.5523 19 21 19.4477 21 20V21C21 21.5523 20.5523 22 20 22H4C3.44772 22 3 21.5523 3 21V20C3 19.4477 3.44772 19 4 19H20Z"/>
        </svg>
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-status="watched">Просмотрено</button>
    <button class="tab" data-status="want">Хочу посмотреть</button>
    <button class="tab" data-status="dropped">Забросил</button>
  </div>
  <div class="controls">
    <div class="search-row">
      <input type="search" id="search" placeholder="Найти по названию…">
      <button class="filter-btn" id="filterBtn" aria-label="Фильтры">
        <svg viewBox="0 0 24 24"><polygon points="3,5 21,5 14,13 14,19 10,19 10,13" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="currentColor"/></svg>
        <span class="dot"></span>
      </button>
    </div>
  </div>
  <div id="list"></div>
</div>

<button class="fab" id="openAdd" aria-label="Добавить">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="entrySheet">
    <div class="sheet-handle-wrap" id="entryHandle"><div class="sheet-handle"></div></div>
    <h2 id="sheetTitle" class="serif">Новая запись</h2>
    <form id="entryForm">
      <label for="fTitle">Название</label>
      <input type="text" id="fTitle" required placeholder="Например, «Матрица»">

      <label>Статус</label>
      <div class="type-toggle" id="statusToggle">
        <button type="button" data-status="watched" class="active">Просмотрено</button>
        <button type="button" data-status="want">Хочу</button>
        <button type="button" data-status="dropped">Забросил</button>
      </div>

      <label>Тип</label>
      <div class="type-toggle">
        <button type="button" data-type="movie" class="active">Фильм</button>
        <button type="button" data-type="series">Сериал</button>
        <button type="button" data-type="anime">Аниме</button>
        <button type="button" data-type="cartoon_movie">Мультфильм</button>
        <button type="button" data-type="cartoon_series">Мультсериал</button>
        <button type="button" data-type="dorama">Дорама</button>
      </div>

      <div id="ratingGroup">
        <label>Оценка</label>
        <div class="star-pick" id="starPick">
          <button type="button" data-v="1">★</button>
          <button type="button" data-v="2">★</button>
          <button type="button" data-v="3">★</button>
          <button type="button" data-v="4">★</button>
          <button type="button" data-v="5">★</button>
        </div>
      </div>

      <label for="fDate" id="dateLabel">Дата просмотра</label>
      <input type="date" id="fDate">

      <label for="fNote">Заметка (необязательно)</label>
      <textarea id="fNote" placeholder="Впечатления, с кем смотрели…"></textarea>

      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn primary" id="saveBtn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="filterOverlay">
  <div class="sheet" id="filterSheet">
    <div class="sheet-handle-wrap" id="filterHandle"><div class="sheet-handle"></div></div>
    <h2 class="serif">Фильтры</h2>
    <label>Тип</label>
    <div class="type-toggle" id="filterTypeToggle">
      <button type="button" data-type="dorama">Дорама</button>
      <button type="button" data-type="movie">Фильм</button>
      <button type="button" data-type="series">Сериал</button>
      <button type="button" data-type="anime">Аниме</button>
      <button type="button" data-type="cartoon_movie">Мультфильм</button>
      <button type="button" data-type="cartoon_series">Мультсериал</button>
      <button type="button" data-type="all" class="active">Все</button>
    </div>

    <label>Оценка</label>
    <div class="star-pick" id="filterStarPick">
      <button type="button" data-v="1">★</button>
      <button type="button" data-v="2">★</button>
      <button type="button" data-v="3">★</button>
      <button type="button" data-v="4">★</button>
      <button type="button" data-v="5">★</button>
    </div>

    <label>&nbsp;</label>
    <button type="button" class="toggle-pill" id="filterBestBtn">★ Только лучшее</button>

    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="filterReset">Сбросить</button>
      <button type="button" class="btn primary" id="filterDone">Готово</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = 'filmDiary:entries';
  var entries = [];
  try { entries = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ entries = []; }

  var state = { filterTypes: new Set(), search:'', editingId:null, type:'movie', rating:0, status:'watched', formStatus:'watched', bestOnly:false, minRating:0 };

  var TYPE_LABELS = { movie:'фильм', series:'сериал', anime:'аниме', cartoon_movie:'мультфильм', cartoon_series:'мультсериал', dorama:'дорама' };

  var listEl = document.getElementById('list');
  var statsEl = document.getElementById('stats');
  var searchEl = document.getElementById('search');
  var overlay = document.getElementById('overlay');
  var form = document.getElementById('entryForm');
  var starPick = document.getElementById('starPick');
  var sheetTitle = document.getElementById('sheetTitle');
  var ratingGroup = document.getElementById('ratingGroup');
  var dateLabel = document.getElementById('dateLabel');
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var filterBtn = document.getElementById('filterBtn');
  var filterOverlay = document.getElementById('filterOverlay');
  var filterStarPick = document.getElementById('filterStarPick');
  var filterBestBtn = document.getElementById('filterBestBtn');

  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch(e){}
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function todayLocal(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function fmtDate(d){
    if(!d) return '';
    var parts = d.split('-');
    return parseInt(parts[2],10) + ' ' + MONTHS[parseInt(parts[1],10)-1] + ' ' + parts[0];
  }

  function monthKey(d){ return d ? d.slice(0,7) : '0000-00'; }
  function monthLabel(d){
    if(!d) return 'Без даты';
    var parts = d.split('-');
    return MONTHS_NOM[parseInt(parts[1],10)-1] + ' ' + parts[0];
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function pluralEntries(n){
    var m = n % 100;
    if(m>=11 && m<=14) return 'записей';
    var l = n % 10;
    if(l===1) return 'запись';
    if(l>=2 && l<=4) return 'записи';
    return 'записей';
  }

  function render(){
    var q = state.search.trim().toLowerCase();
    var inTab = entries.filter(function(e){ return (e.status||'watched') === state.status; });
    var filtered = inTab.filter(function(e){
      if(state.filterTypes.size > 0 && !state.filterTypes.has(e.type)) return false;
      if(state.bestOnly && !e.best) return false;
      if(state.minRating > 0 && (e.rating||0) !== state.minRating) return false;
      if(q && e.title.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    filtered.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    filterBtn.classList.toggle('on', state.filterTypes.size>0 || state.bestOnly || state.minRating>0);

    statsEl.textContent = filtered.length + ' ' + pluralEntries(filtered.length);

    if(filtered.length === 0){
      listEl.innerHTML = '<div class="empty"><div class="big">🎬</div>' +
        (inTab.length === 0
          ? 'Пока пусто здесь.'
          : 'Ничего не найдено.') + '</div>';
      return;
    }

    var html = '';
    var lastMonth = null;
    filtered.forEach(function(e){
      var mk = monthKey(e.date);
      if(mk !== lastMonth){
        html += '<div class="month">' + monthLabel(e.date) + '</div>';
        lastMonth = mk;
      }
      var stars = '';
      for(var i=1;i<=5;i++) stars += (i<=e.rating ? '★' : '☆');
      html += '<div class="card ' + e.type + '" data-id="' + e.id + '">' +
        '<div class="card-top"><p class="card-title' + (e.best?' best':'') + '">' + escapeHtml(e.title) + '</p>' +
        '<div class="card-actions">' +
        '<button class="icon-btn' + (e.best?' best-on':'') + '" data-action="best" data-id="' + e.id + '" aria-label="Лучшее">' + (e.best?'★':'☆') + '</button>' +
        '<button class="icon-btn" data-action="edit" data-id="' + e.id + '">✎</button>' +
        '<button class="icon-btn" data-action="delete" data-id="' + e.id + '">🗑</button>' +
        '</div></div>' +
        '<div class="meta-row">' +
        (e.rating>0 ? '<span class="stars">'+stars+'</span>' : '') +
        '<span class="badge">' + (TYPE_LABELS[e.type]||e.type) + '</span>' +
        (e.date ? '<span class="date">' + fmtDate(e.date) + '</span>' : '') +
        '</div>' +
        (e.note ? '<p class="note">' + escapeHtml(e.note) + '</p>' : '') +
        '</div>';
    });
    listEl.innerHTML = html;
  }

  function openModal(entry){
    state.editingId = entry ? entry.id : null;
    sheetTitle.textContent = entry ? 'Изменить запись' : 'Новая запись';
    document.getElementById('fTitle').value = entry ? entry.title : '';
    document.getElementById('fNote').value = entry ? (entry.note||'') : '';
    document.getElementById('fDate').value = entry ? (entry.date||'') : todayLocal();
    setType(entry ? entry.type : 'movie');
    setStatus(entry ? (entry.status||'watched') : state.status);
    setRating(entry ? entry.rating : 0);
    overlay.classList.add('open');
    history.pushState({modal:'entry'}, '');
  }
  function closeModal(){
    if(!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    form.reset();
    history.back();
  }

  function setType(t){
    state.type = t;
    document.querySelectorAll('.type-toggle button[data-type]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-type')===t);
    });
  }
  function setStatus(s){
    state.formStatus = s;
    document.querySelectorAll('#statusToggle button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-status')===s);
    });
    ratingGroup.classList.toggle('field-hide', s==='want');
    dateLabel.textContent = s==='want' ? 'Дата (необязательно)' : 'Дата просмотра';
  }
  function setRating(r){
    state.rating = r;
    document.querySelectorAll('#starPick button').forEach(function(b){
      b.classList.toggle('on', parseInt(b.getAttribute('data-v'),10) <= r);
    });
  }

  document.querySelectorAll('.type-toggle button[data-type]').forEach(function(b){
    b.addEventListener('click', function(){ setType(b.getAttribute('data-type')); });
  });
  document.querySelectorAll('#statusToggle button').forEach(function(b){
    b.addEventListener('click', function(){ setStatus(b.getAttribute('data-status')); });
  });
  starPick.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if(!b) return;
    var v = parseInt(b.getAttribute('data-v'),10);
    setRating(v === state.rating ? 0 : v);
  });

  document.getElementById('openAdd').addEventListener('click', function(){ openModal(null); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(ev){ if(ev.target === overlay) closeModal(); });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var title = document.getElementById('fTitle').value.trim();
    if(!title) return;
    var data = {
      title: title,
      type: state.type,
      status: state.formStatus,
      rating: state.rating,
      date: document.getElementById('fDate').value,
      note: document.getElementById('fNote').value.trim()
    };
    if(state.editingId){
      entries = entries.map(function(e){
        return e.id === state.editingId ? Object.assign({}, e, data) : e;
      });
    } else {
      data.id = uid();
      entries.push(data);
    }
    save();
    closeModal();
    render();
  });

  listEl.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if(!b) return;
    var id = b.getAttribute('data-id');
    var action = b.getAttribute('data-action');
    if(action === 'edit'){
      var entry = entries.find(function(e){return e.id===id;});
      if(entry) openModal(entry);
    } else if(action === 'best'){
      entries = entries.map(function(e){
        return e.id === id ? Object.assign({}, e, {best: !e.best}) : e;
      });
      save();
      render();
    } else if(action === 'delete'){
      if(confirm('Удалить эту запись?')){
        entries = entries.filter(function(e){return e.id!==id;});
        save();
        render();
      }
    }
  });

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      state.status = t.getAttribute('data-status');
      render();
    });
  });

  document.querySelectorAll('#filterTypeToggle button').forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.getAttribute('data-type');
      if(t === 'all'){
        state.filterTypes.clear();
      } else if(state.filterTypes.has(t)){
        state.filterTypes.delete(t);
      } else {
        state.filterTypes.add(t);
      }
      document.querySelectorAll('#filterTypeToggle button').forEach(function(x){
        var xt = x.getAttribute('data-type');
        x.classList.toggle('active', xt==='all' ? state.filterTypes.size===0 : state.filterTypes.has(xt));
      });
      render();
    });
  });

  filterStarPick.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if(!b) return;
    var v = parseInt(b.getAttribute('data-v'),10);
    state.minRating = (v === state.minRating) ? 0 : v;
    filterStarPick.querySelectorAll('button').forEach(function(sb){
      sb.classList.toggle('on', parseInt(sb.getAttribute('data-v'),10) <= state.minRating);
    });
    render();
  });

  filterBestBtn.addEventListener('click', function(){
    state.bestOnly = !state.bestOnly;
    filterBestBtn.classList.toggle('active', state.bestOnly);
    render();
  });

  filterBtn.addEventListener('click', function(){
    filterOverlay.classList.add('open');
    history.pushState({modal:'filter'}, '');
  });
  function closeFilterOverlay(){
    if(!filterOverlay.classList.contains('open')) return;
    filterOverlay.classList.remove('open');
    history.back();
  }
  document.getElementById('filterDone').addEventListener('click', closeFilterOverlay);
  filterOverlay.addEventListener('click', function(ev){ if(ev.target === filterOverlay) closeFilterOverlay(); });

  window.addEventListener('popstate', function(){
    overlay.classList.remove('open');
    filterOverlay.classList.remove('open');
  });

  function enableSwipeDismiss(sheetEl, handleEl, closeFn){
    var startY = 0, dy = 0, dragging = false;
    handleEl.addEventListener('touchstart', function(ev){
      dragging = true; dy = 0;
      startY = ev.touches[0].clientY;
      sheetEl.style.transition = 'none';
    }, {passive:true});
    handleEl.addEventListener('touchmove', function(ev){
      if(!dragging) return;
      dy = ev.touches[0].clientY - startY;
      if(dy < 0) dy = 0;
      sheetEl.style.transform = 'translateY(' + dy + 'px)';
    }, {passive:true});
    handleEl.addEventListener('touchend', function(){
      if(!dragging) return;
      dragging = false;
      sheetEl.style.transition = '';
      sheetEl.style.transform = '';
      if(dy > 90) closeFn();
      dy = 0;
    });
  }
  enableSwipeDismiss(document.getElementById('entrySheet'), document.getElementById('entryHandle'), closeModal);
  enableSwipeDismiss(document.getElementById('filterSheet'), document.getElementById('filterHandle'), closeFilterOverlay);

  document.getElementById('filterReset').addEventListener('click', function(){
    state.filterTypes.clear(); state.minRating = 0; state.bestOnly = false;
    document.querySelectorAll('#filterTypeToggle button').forEach(function(x){x.classList.toggle('active', x.getAttribute('data-type')==='all');});
    filterStarPick.querySelectorAll('button').forEach(function(sb){ sb.classList.remove('on'); });
    filterBestBtn.classList.remove('active');
    render();
  });

  importBtn.addEventListener('click', function(){ importFile.click(); });

  searchEl.addEventListener('input', function(){
    state.search = searchEl.value;
    render();
  });

  exportBtn.addEventListener('click', function(){
    try{
      var blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = todayLocal();
      a.href = url;
      a.download = 'film-diary-backup-' + d + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ alert('Не получилось создать файл резервной копии.'); }
  });

  importFile.addEventListener('change', function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var incoming = JSON.parse(reader.result);
        if(!Array.isArray(incoming)) throw new Error('bad format');
        var existingIds = {};
        entries.forEach(function(e){ existingIds[e.id] = true; });
        var added = 0;
        incoming.forEach(function(e){
          if(e && e.id && !existingIds[e.id]){
            entries.push(e);
            existingIds[e.id] = true;
            added++;
          }
        });
        save();
        render();
        alert('Добавлено записей: ' + added + '.');
      }catch(e){
        alert('Не получилось прочитать файл — убедитесь, что это резервная копия из этого приложения.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
